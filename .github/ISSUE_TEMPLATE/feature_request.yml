name: Feature request
description: Suggest a new feature or an improvement.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share the problem you want to solve and the outcome you want to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem or limitation are you trying to address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any alternatives you considered.
