name: Question
description: Ask a question about the project or usage.
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Use this form for usage questions or clarification requests.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include code snippets, links, or any relevant background.
