name: Home Assistant Validate

on:
  pull_request:
    paths:
      - home-assistant/**
      - hacs.json
      - .github/workflows/home-assistant-*.yml
  push:
    branches:
      - main
    paths:
      - home-assistant/**
      - hacs.json
      - .github/workflows/home-assistant-*.yml

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON metadata
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool home-assistant/integration/custom_components/freeapi/manifest.json > /dev/null
          python -m json.tool home-assistant/integration/custom_components/freeapi/strings.json > /dev/null
          python -m json.tool home-assistant/integration/custom_components/freeapi/translations/en.json > /dev/null

      - name: Validate integration source compiles
        run: python -m compileall home-assistant/integration/custom_components/freeapi

      - name: Run repository tests
        run: pytest -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate addon image build
        run: docker build -f home-assistant/addon/freeapi/Dockerfile .
