name: Home Assistant Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate integration source compiles
        run: python -m compileall home-assistant/integration/custom_components/freeapi

      - name: Validate addon image build
        run: docker build -f home-assistant/addon/freeapi/Dockerfile home-assistant/addon/freeapi

  release:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract addon image metadata
        id: addon_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/freepyapi/freeapi-addon
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push addon image
        uses: docker/build-push-action@v7
        with:
          context: home-assistant/addon/freeapi
          file: home-assistant/addon/freeapi/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.addon_meta.outputs.tags }}
          labels: ${{ steps.addon_meta.outputs.labels }}

      - name: Package integration artifact
        run: |
          mkdir -p dist/freeapi-integration/custom_components
          cp -r home-assistant/integration/custom_components/freeapi dist/freeapi-integration/custom_components/
          cd dist/freeapi-integration
          zip -r ../freeapi-hacs-integration.zip custom_components

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/freeapi-hacs-integration.zip
            home-assistant/README.md
