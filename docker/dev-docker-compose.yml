services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: freeapi-dev
    env_file:
      - ../.env.local
    environment:
      - ENV=development
      - FREEAPI_CURRENT_VERSION=${FREEAPI_CURRENT_VERSION}
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=freeapi
      - POSTGRES_USER=freeapi
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: freeapi-postgres
    env_file:
      - ../.env.local
    environment:
      POSTGRES_DB: freeapi
      POSTGRES_USER: freeapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeapi -d freeapi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: freeapi-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

